name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Calidad estática + tests de integración sobre PostgreSQL real.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taller
          POSTGRES_PASSWORD: taller
          POSTGRES_DB: taller_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taller" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taller:taller@localhost:5432/taller_test
      DATABASE_URL: postgresql://taller:taller@localhost:5432/taller_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # Flujos reales en navegador (escritorio y móvil) sobre el build de producción.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taller
          POSTGRES_PASSWORD: taller
          POSTGRES_DB: taller_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taller" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://taller:taller@localhost:5432/taller_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Accesibilidad, buenas prácticas y SEO con umbrales (falla el CI si bajan).
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taller
          POSTGRES_PASSWORD: taller
          POSTGRES_DB: taller_lhci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taller" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taller:taller@localhost:5432/taller_lhci
      SESSION_SECRET: lhci-secret-lhci-secret-lhci-secret-12
      SITE_URL: http://127.0.0.1:3600
      PORT: '3600'
      EXCHANGE_RATE_API_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:deploy
      # NODE_ENV solo aquí: a nivel de job, `npm ci` omitiría las devDependencies del build.
      - run: npx @lhci/cli@0.16.1 autorun
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # La imagen de producción y la de migraciones compilan.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen de runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
